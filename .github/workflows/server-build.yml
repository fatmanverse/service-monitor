name: Build Service Monitor Server

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Build frontend assets
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
      - run: npm install --legacy-peer-deps --prefix frontend
      - run: npm run build --prefix frontend
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error

  backend:
    name: ${{ matrix.name }}
    needs: frontend
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: service-monitor-server-linux-x86_64-glibc217
            runner: ubuntu-22.04
            platform: linux/amd64
            image: quay.io/pypa/manylinux2014_x86_64
          - name: service-monitor-server-linux-x86_64-glibc228
            runner: ubuntu-22.04
            platform: linux/amd64
            image: quay.io/pypa/manylinux_2_28_x86_64
          - name: service-monitor-server-linux-arm64-glibc217
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            image: quay.io/pypa/manylinux2014_aarch64
          - name: service-monitor-server-linux-arm64-glibc228
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            image: quay.io/pypa/manylinux_2_28_aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - name: Build backend binary
        env:
          ARTIFACT_NAME: ${{ matrix.name }}
        run: |
          mkdir -p dist/server
          docker run --rm \
            --platform "${{ matrix.platform }}" \
            -e ARTIFACT_NAME \
            -e OUTPUT_DIR=/workspace/dist/server \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            "${{ matrix.image }}" \
            sh -c 'PYTHON_BIN=$(sh scripts/build-shared-python.sh); export PYTHON_BIN; sh backend/packaging/build.sh'
      - name: Assemble server bundle
        env:
          ARTIFACT_NAME: ${{ matrix.name }}
        run: |
          mkdir -p "release/$ARTIFACT_NAME"
          cp "dist/server/$ARTIFACT_NAME" "dist/server/$ARTIFACT_NAME.sha256" "release/$ARTIFACT_NAME/"
          cp scripts/platform.sh "release/$ARTIFACT_NAME/"
          cp backend/packaging/{install.sh,start.sh,service-monitor-backend.service,service-monitor.env.example} "release/$ARTIFACT_NAME/"
          tar -C "release/$ARTIFACT_NAME" -czf "release/$ARTIFACT_NAME.tar.gz" .
          (cd release && sha256sum "$ARTIFACT_NAME.tar.gz" > "$ARTIFACT_NAME.tar.gz.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            release/${{ matrix.name }}.tar.gz
            release/${{ matrix.name }}.tar.gz.sha256
          if-no-files-found: error

  smoke:
    name: ${{ matrix.image }} server smoke test
    needs: backend
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      # Each artifact runs on a target whose libcrypt SONAME differs from its
      # build image's, because that mismatch is what breaks bundling: the el8
      # image links libcrypt.so.1 while Rocky 9 ships only libcrypt.so.2, and
      # manylinux2014 links libcrypt.so.2 while Debian ships only .so.1.
      matrix:
        include:
          - artifact: service-monitor-server-linux-x86_64-glibc217
            platform: linux/amd64
            image: centos:7
          - artifact: service-monitor-server-linux-x86_64-glibc217
            platform: linux/amd64
            image: rockylinux:9
          - artifact: service-monitor-server-linux-x86_64-glibc228
            platform: linux/amd64
            image: rockylinux:9
          - artifact: service-monitor-server-linux-x86_64-glibc228
            platform: linux/amd64
            image: debian:12-slim
          - artifact: service-monitor-server-linux-arm64-glibc217
            platform: linux/arm64
            image: ubuntu:24.04
          - artifact: service-monitor-server-linux-arm64-glibc228
            platform: linux/arm64
            image: rockylinux:9
    steps:
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: smoke
      - name: Extract server bundle
        run: |
          mkdir -p smoke/server
          tar -xzf "smoke/${{ matrix.artifact }}.tar.gz" -C smoke/server
      - name: Run target image self-test
        run: |
          docker run --rm \
            --platform "${{ matrix.platform }}" \
            -v "$GITHUB_WORKSPACE/smoke/server:/server:ro" \
            "${{ matrix.image }}" \
            "/server/${{ matrix.artifact }}" --self-test

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: smoke
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/**/*.tar.gz
            release/**/*.tar.gz.sha256
