name: Build Service Monitor Agent

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: service-monitor-agent-linux-x86_64-glibc217
            runner: ubuntu-22.04
            platform: linux/amd64
            image: quay.io/pypa/manylinux2014_x86_64
          - name: service-monitor-agent-linux-x86_64-glibc228
            runner: ubuntu-22.04
            platform: linux/amd64
            image: quay.io/pypa/manylinux_2_28_x86_64
          - name: service-monitor-agent-linux-arm64-glibc217
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            image: quay.io/pypa/manylinux2014_aarch64
          - name: service-monitor-agent-linux-arm64-glibc228
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            image: quay.io/pypa/manylinux_2_28_aarch64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build PyInstaller binary
        env:
          ARTIFACT_NAME: ${{ matrix.name }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist/agent"
          docker run --rm \
            --platform "${{ matrix.platform }}" \
            -e ARTIFACT_NAME \
            -e OUTPUT_DIR=/workspace/dist/agent \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            "${{ matrix.image }}" \
            sh agent/packaging/build.sh

      - name: Assemble release bundle
        env:
          ARTIFACT_NAME: ${{ matrix.name }}
        run: |
          mkdir -p "release/$ARTIFACT_NAME"
          cp "dist/agent/$ARTIFACT_NAME" "release/$ARTIFACT_NAME/"
          cp "dist/agent/$ARTIFACT_NAME.sha256" "release/$ARTIFACT_NAME/"
          cp agent/packaging/{platform.sh,install.sh,uninstall.sh,service-monitor-agent.service} "release/$ARTIFACT_NAME/"
          tar -C "release/$ARTIFACT_NAME" -czf "release/$ARTIFACT_NAME.tar.gz" .
          (cd release && sha256sum "$ARTIFACT_NAME.tar.gz" > "$ARTIFACT_NAME.tar.gz.sha256")

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            release/${{ matrix.name }}.tar.gz
            release/${{ matrix.name }}.tar.gz.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download bundles
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/**/*.tar.gz
            release/**/*.tar.gz.sha256
