name: Agent Compatibility Checks

on:
  pull_request:
    paths:
      - "agent/**"
      - "scripts/build-shared-python.sh"
      - "scripts/platform.sh"
      - ".github/workflows/agent-*.yml"
  push:
    branches:
      - main
    paths:
      - "agent/**"
      - "scripts/build-shared-python.sh"
      - "scripts/platform.sh"
      - ".github/workflows/agent-*.yml"

permissions:
  contents: read

jobs:
  unit:
    name: Agent unit tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check pytest==8.4.1 -e agent
      - run: PYTHONPATH=agent python -m pytest agent/tests -q

  packaging:
    name: Packaging checks
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        include:
          - image: quay.io/pypa/manylinux2014_x86_64
            platform: linux/amd64
          - image: quay.io/pypa/manylinux_2_28_x86_64
            platform: linux/amd64
          - image: quay.io/pypa/manylinux2014_aarch64
            platform: linux/arm64
          - image: quay.io/pypa/manylinux_2_28_aarch64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Validate packaging scripts
        run: |
          sh -n scripts/platform.sh agent/packaging/build.sh agent/packaging/install.sh agent/packaging/uninstall.sh
      - name: Validate target image libc baseline
        run: |
          docker run --rm --platform "${{ matrix.platform }}" "${{ matrix.image }}" sh -c 'getconf GNU_LIBC_VERSION && uname -m'

  smoke-build:
    name: Build ${{ matrix.artifact }} for smoke tests
    needs: packaging
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: service-monitor-agent-linux-x86_64-glibc217
            build_image: quay.io/pypa/manylinux2014_x86_64
            platform: linux/amd64
          - artifact: service-monitor-agent-linux-x86_64-glibc228
            build_image: quay.io/pypa/manylinux_2_28_x86_64
            platform: linux/amd64
          - artifact: service-monitor-agent-linux-arm64-glibc217
            build_image: quay.io/pypa/manylinux2014_aarch64
            platform: linux/arm64
          - artifact: service-monitor-agent-linux-arm64-glibc228
            build_image: quay.io/pypa/manylinux_2_28_aarch64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Build smoke artifact
        env:
          ARTIFACT_NAME: ${{ matrix.artifact }}
        run: |
          mkdir -p dist/agent
          docker run --rm \
            --platform "${{ matrix.platform }}" \
            -e ARTIFACT_NAME \
            -e OUTPUT_DIR=/workspace/dist/agent \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            "${{ matrix.build_image }}" \
            sh -c 'PYTHON_BIN=$(sh scripts/build-shared-python.sh); export PYTHON_BIN; sh agent/packaging/build.sh'
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.artifact }}
          path: dist/agent/${{ matrix.artifact }}
          if-no-files-found: error

  smoke:
    name: ${{ matrix.image }} binary smoke test
    needs: smoke-build
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: service-monitor-agent-linux-x86_64-glibc217
            platform: linux/amd64
            image: centos:7
          - artifact: service-monitor-agent-linux-x86_64-glibc217
            platform: linux/amd64
            image: rockylinux:8
          - artifact: service-monitor-agent-linux-x86_64-glibc228
            platform: linux/amd64
            image: rockylinux:9
          - artifact: service-monitor-agent-linux-x86_64-glibc217
            platform: linux/amd64
            image: ubuntu:20.04
          - artifact: service-monitor-agent-linux-x86_64-glibc228
            platform: linux/amd64
            image: ubuntu:22.04
          - artifact: service-monitor-agent-linux-x86_64-glibc228
            platform: linux/amd64
            image: ubuntu:24.04
          - artifact: service-monitor-agent-linux-x86_64-glibc217
            platform: linux/amd64
            image: debian:11-slim
          - artifact: service-monitor-agent-linux-x86_64-glibc228
            platform: linux/amd64
            image: debian:12-slim
          - artifact: service-monitor-agent-linux-arm64-glibc228
            platform: linux/arm64
            image: ubuntu:24.04
          - artifact: service-monitor-agent-linux-arm64-glibc228
            platform: linux/arm64
            image: debian:12-slim
    steps:
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: actions/download-artifact@v4
        with:
          name: smoke-${{ matrix.artifact }}
          path: dist/agent
      - run: chmod +x "dist/agent/${{ matrix.artifact }}"
      - name: Run target image self-test
        run: |
          docker run --rm \
            --platform "${{ matrix.platform }}" \
            -v "$GITHUB_WORKSPACE/dist/agent:/agent:ro" \
            "${{ matrix.image }}" \
            "/agent/${{ matrix.artifact }}" --self-test
