syntax = "proto3";

package service_monitor.agent.v1;

service AgentControl {
  rpc Enroll(EnrollRequest) returns (EnrollResponse);
  rpc Claim(ClaimRequest) returns (ClaimResponse);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  rpc GetConfig(ConfigRequest) returns (ConfigResponse);
  rpc Report(ReportRequest) returns (ReportResponse);
}

message EnrollRequest {
  uint32 protocol_version = 1;
  string agent_uuid = 2;
  string claim_token = 3;
  string hostname = 4;
  string runtime_user = 5;
  string os_release = 6;
  string architecture = 7;
  string glibc_version = 8;
  string agent_version = 9;
}

message EnrollResponse {
  uint32 protocol_version = 1;
  string agent_uuid = 2;
  string status = 3;
}

message ClaimRequest {
  uint32 protocol_version = 1;
  string agent_uuid = 2;
  string claim_token = 3;
}

message ClaimResponse {
  uint32 protocol_version = 1;
  string agent_uuid = 2;
  string agent_secret = 3;
}

message HeartbeatRequest {
  uint32 protocol_version = 1;
  uint64 config_revision = 2;
  uint32 outbox_size = 3;
}

message AgentCommand {
  string command_id = 1;
  int64 service_id = 2;
  string command_type = 3;
  string expires_at = 4;
}

message HeartbeatResponse {
  uint32 protocol_version = 1;
  uint64 config_revision = 2;
  bool config_changed = 3;
  repeated AgentCommand commands = 4;
}

message ConfigRequest {
  uint32 protocol_version = 1;
}

message ProbeConfig {
  string key = 1;
  string name = 2;
  string probe_type = 3;
  optional string process_pattern = 4;
  optional string url = 5;
  string headers_json = 6;
  optional string body_json = 7;
  string auth_type = 8;
  optional string auth_username = 9;
  optional string auth_secret = 10;
  int32 expected_status = 11;
  int32 timeout_seconds = 12;
}

message ServiceConfig {
  int64 id = 1;
  string name = 2;
  repeated ProbeConfig probes = 3;
  string health_rule_json = 4;
  optional string start_command = 5;
  optional string start_user = 6;
  int32 check_interval = 7;
  bool auto_restart = 8;
}

message ConfigResponse {
  uint32 protocol_version = 1;
  uint64 config_revision = 2;
  int64 host_id = 3;
  repeated ServiceConfig services = 4;
}

message ProbeReport {
  string key = 1;
  bool success = 2;
  string message = 3;
  optional int32 response_ms = 4;
}

message ServiceReport {
  string report_id = 1;
  uint64 report_sequence = 2;
  int64 service_id = 3;
  bool success = 4;
  string message = 5;
  optional int32 response_ms = 6;
  bool restarted = 7;
  string occurred_at = 8;
  repeated ProbeReport probes = 9;
  optional string command_id = 10;
}

message ReportRequest {
  uint32 protocol_version = 1;
  repeated ServiceReport reports = 2;
}

message ReportResponse {
  uint32 protocol_version = 1;
  uint32 accepted = 2;
  uint32 duplicates = 3;
}
